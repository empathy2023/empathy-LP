<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>empathy</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;700;800&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Outfit', sans-serif;
      background: #0A0A0A;
      color: #fff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card {
      width: 100%;
      max-width: 420px;
      padding: 56px 32px 48px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0;
    }

    /* ロゴ */
    .logo-wrap {
      width: 200px;
      height: 200px;
      border-radius: 24px;
      overflow: hidden;
      margin-bottom: 40px;
    }
    .logo-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* 会社名 */
    .company {
      font-size: 13px;
      font-weight: 300;
      letter-spacing: .22em;
      text-transform: uppercase;
      color: rgba(255,255,255,.4);
      margin-bottom: 8px;
    }
    .tagline {
      font-size: 15px;
      color: rgba(255,255,255,.6);
      margin-bottom: 48px;
      letter-spacing: .04em;
    }

    /* リンクボタン */
    .links {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .link-btn {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 18px 24px;
      border-radius: 14px;
      text-decoration: none;
      color: #fff;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: .04em;
      transition: transform .2s, opacity .2s;
      position: relative;
      overflow: hidden;
    }
    .link-btn:active { transform: scale(.97); opacity: .85; }
    .link-btn .icon {
      width: 42px;
      height: 42px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      flex-shrink: 0;
    }
    .link-btn .label { flex: 1; }
    .link-btn .arr {
      font-size: 18px;
      opacity: .5;
    }

    /* YouTube */
    .btn-yt {
      background: #1A0A0A;
      border: 1px solid rgba(255,50,50,.25);
    }
    .btn-yt .icon { background: rgba(255,50,50,.15); }
    .btn-yt:hover { border-color: rgba(255,50,50,.5); }

    /* Instagram */
    .btn-ig {
      background: #0A0A1A;
      border: 1px solid rgba(180,80,200,.25);
    }
    .btn-ig .icon { background: rgba(180,80,200,.15); }
    .btn-ig:hover { border-color: rgba(180,80,200,.5); }

    /* HP */
    .btn-hp {
      background: #0A1020;
      border: 1px solid rgba(200,16,46,.25);
    }
    .btn-hp .icon { background: rgba(200,16,46,.15); }
    .btn-hp:hover { border-color: rgba(200,16,46,.5); }

    /* 区切り線 */
    .divider {
      width: 40px;
      height: 2px;
      background: rgba(255,255,255,.08);
      margin: 32px 0;
    }

    /* フッター */
    .footer {
      margin-top: 48px;
      font-size: 11px;
      color: rgba(255,255,255,.2);
      letter-spacing: .1em;
    }
  </style>
</head>
